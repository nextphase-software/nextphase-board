# SPDX-License-Identifier: Apache-2.0
# Typecheck, unit tests, builds, licence checks and both server suites on every push to main
# and to work branches. Each server suite is split by test file over three machines, and every
# machine starts its own disposable local Supabase stack from supabase/config.toml, as described
# in tests/README.md "Server validation".
#
# Speed checks: a few S checks assert time limits (for example S93, connections close within
# two seconds). Hosted runners are about half as fast as the reference machine those limits were
# measured on, so these checks are left out here and run on the reference machine at review.
# Keep the list short and say why in the note.
name: Checks
# Each run's title in the Actions list says what it checks and where, for example
# "Tests and builds · codex/0011-W2-table-csv" or "Tests and builds · main · started by hand".
# The commit is shown under the title.
run-name: >-
  Tests and builds · ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' · started by hand' || '' }}

on:
  push:
    branches: [main, "codex/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # S80, S93: close-time limits; S170: checkpoint timing. They pass on the reference machine and
  # failed in both full runs on hosted runners.
  SPEED_CHECKS: "80|93|170"

jobs:
  static:
    name: Typecheck, unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some unit tests compare files with earlier commits (git show <commit>:<path>).
          fetch-depth: 0
          persist-credentials: false
      - id: node
        name: Read the Node version
        run: echo "version=$(jq -r .engines.node package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build the app and check its notices
        run: |
          npm run build
          npm run audit:licenses
      - name: Build the fixtures
        run: npm run build:fixtures
      - name: Build the server and check its notices
        run: |
          npm run build:server
          npm run audit:licenses
      - name: Builds change no tracked file
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  server:
    name: Server suite (${{ matrix.runner }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [node, workerd]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some unit tests compare files with earlier commits (git show <commit>:<path>).
          fetch-depth: 0
          persist-credentials: false
      - id: node
        name: Read the Node version
        run: echo "version=$(jq -r .engines.node package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the disposable local stack
        run: |
          node tests/server/make-signing-key.mjs
          start=$(date +%s)
          npx supabase start
          echo "Stack started in $(( $(date +%s) - start )) s"
          node tests/server/write-stack-info.mjs
      - name: Run part ${{ matrix.shard }} of 3 of the ${{ matrix.runner }} server suite, without the speed checks
        run: |
          set -o pipefail
          mkdir -p logs
          echo "Left out here: S${SPEED_CHECKS//|/, S}"
          npm run "test:server:${{ matrix.runner }}" -- --shard="${{ matrix.shard }}/3" -t "^(?!S(${SPEED_CHECKS}) )" 2>&1 \
            | tee "logs/server-${{ matrix.runner }}.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Server suite (${{ matrix.runner }} ${{ matrix.shard }}/3; left out: S${SPEED_CHECKS//|/, S})"
            echo
            sed 's/\x1b\[[0-9;]*m//g' "logs/server-${{ matrix.runner }}.log" | grep -E "^ *(Test Files|Tests|Duration) " | sed 's/^ */- /' || echo "- no result lines"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.runner }}-${{ matrix.shard }}-log
          path: logs
          retention-days: 14

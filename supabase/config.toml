project_id = "nextphase-board-test"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 55322
shadow_port = 55325
major_version = 17
[db.pooler]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = true
port = 55324
[storage]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
enable_signup = false
jwt_expiry = 3600
signing_keys_path = "./signing_keys.json"
[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000
